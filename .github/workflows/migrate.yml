name: Migrate database

# Run the migrations against a chosen environment, by hand. The deploy
# already migrates development then production on every merge; this
# exists for applying a migration ahead of a deploy, or for retrying
# one environment without shipping a new image. Idempotent: drizzle
# applies only what is pending, under an advisory lock.
#
# Each environment carries its own DATABASE_URL secret. Use the direct
# (non-pooler) URL: the advisory lock is session state, which
# transaction-mode pooling silently breaks.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Which database to migrate
        type: choice
        required: true
        default: development
        options:
          - development
          - production

jobs:
  migrate:
    if: github.repository == 'danielpang/bento'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bento/db... build
      - run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
