name: Model proxy sandbox e2e

# Calls Bento's model proxy from inside a real Fly Sprite and a real
# Modal sandbox: a run token works for what its grant names, every other
# credential is the same 404 that never reaches the provider, the
# endpoint allowlist holds, and Claude Code finishes a turn through it.
# On Modal the box gets the restricted network Bento computes for a
# locked team, and is shown to reach the proxy and the team's allowed
# site and nothing else. See apps/server/src/model-proxy-sandbox.e2e.test.ts.
#
# Reachability. A sandbox cannot reach the runner, so the test serves
# the proxy (and nothing else of Bento's) on loopback and opens a
# Cloudflare quick tunnel to it with cloudflared, pinned and checked
# against its checksum below. Postgres and the stand-in provider stay on
# the runner; the proxy reaches the stand-in over loopback. The tunnel
# is the test's child process and ends with it, and the runner ends
# every process with the job.
#
# Not part of CI. Each job costs a machine and several minutes. It runs
# when it earns its cost:
#
#   proxy PR   a change to the proxy, its grants and cache, how a run's
#              environment and a Modal run's network are built, the
#              provider table, or the Modal driver's allowlist
#   by hand    after a change on either provider's side
#
# Needs SPRITES_TOKEN (sprite job) and MODAL_TOKEN_ID, MODAL_TOKEN_SECRET
# (modal job). Without them a job says so and stops, rather than passing
# on a test that never ran.

on:
  pull_request:
    paths:
      - apps/server/src/routes/model-proxy.ts
      - apps/server/src/mcp/grants.ts
      - apps/server/src/mcp/model-proxy-cache.ts
      - apps/server/src/orchestrator/model-proxy-env.ts
      - apps/server/src/orchestrator/modal-hosts.ts
      - apps/server/src/orchestrator/sandbox-network.ts
      - packages/core/src/model-providers.ts
      - packages/sandbox/src/modal.ts
      - apps/server/src/model-proxy-sandbox.e2e.test.ts
      - .github/workflows/model-proxy-e2e.yml
  workflow_dispatch:

env:
  CLOUDFLARED_VERSION: 2025.8.1
  CLOUDFLARED_SHA256: a66353004197ee4c1fcb68549203824882bba62378ad4d00d234bdb8251f1114

jobs:
  sprite:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # One at a time, so the cost stays predictable. Its own group, so
    # it does not queue behind the toolchain's sprite e2e.
    concurrency:
      group: model-proxy-e2e-sprite
      cancel-in-progress: false
    # The proxy reads grants and keys from a real database. The test
    # creates its own database and runs the migrations into it.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/app
      BENTO_PROXY_SPRITE_E2E: "1"
      SPRITES_TOKEN: ${{ secrets.SPRITES_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A failed test step ends with a recap of every failing test (file,
      # line, name, error), so the last lines of the log, where GitHub
      # mobile opens it, say what failed. See scripts/test-failures-reporter.mjs.
      - name: Record failing tests for the recap
        run: |
          echo "BENTO_TEST_FAILURES_DIR=$RUNNER_TEMP/test-failures" >> "$GITHUB_ENV"
          echo "BENTO_TEST_REPORTERS=--test-reporter=spec --test-reporter-destination=stdout --test-reporter=$GITHUB_WORKSPACE/scripts/test-failures-reporter.mjs --test-reporter-destination=stderr" >> "$GITHUB_ENV"

      # tsx runs the server's sources, but its workspace dependencies
      # resolve through their package exports, which point at dist.
      # Without this the test dies at import, and so does the cleanup
      # step, which needs the sandbox package.
      - run: pnpm turbo run build --filter=@bento/server^...

      - name: Note that a fork cannot provision a sprite
        if: ${{ env.SPRITES_TOKEN == '' && github.event.pull_request.head.repo.fork }}
        run: |
          echo "::notice::A fork has no SPRITES_TOKEN, so no sprite was provisioned. A maintainer can run this workflow by hand against the branch."

      - name: Refuse to pass without a token
        if: ${{ env.SPRITES_TOKEN == '' && !github.event.pull_request.head.repo.fork }}
        run: |
          echo "SPRITES_TOKEN is not set, so no sprite can be provisioned." >&2
          echo "Add it under Settings, Secrets and variables, Actions." >&2
          exit 1

      - name: Install cloudflared
        if: ${{ env.SPRITES_TOKEN != '' }}
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/cloudflared" \
            "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64"
          echo "${CLOUDFLARED_SHA256}  $RUNNER_TEMP/cloudflared" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/cloudflared"
          "$RUNNER_TEMP/cloudflared" --version
          echo "BENTO_CLOUDFLARED=$RUNNER_TEMP/cloudflared" >> "$GITHUB_ENV"

      # The spec reporter (in BENTO_TEST_REPORTERS), because it prints
      # the test's own lines as they are, which is what lets the test
      # mask its run tokens.
      - name: Call the proxy from a sprite
        if: ${{ env.SPRITES_TOKEN != '' }}
        working-directory: apps/server
        env:
          NODE_OPTIONS: ${{ env.BENTO_TEST_REPORTERS }}
        run: node --test --import tsx src/model-proxy-sandbox.e2e.test.ts || { node "$GITHUB_WORKSPACE/scripts/test-failures-summary.mjs"; exit 1; }

      # The test deletes its own sprite and asserts it went. This is for
      # a cancelled job, the timeout above, or a runner that died: a
      # sprite lives until something deletes it. The name is derived
      # from the run the same way the test derives it, and a test in
      # ordinary CI pins the two together.
      - name: Delete the sprite even if the run was killed
        if: ${{ always() && env.SPRITES_TOKEN != '' }}
        working-directory: packages/sandbox
        run: node --import tsx scripts/delete-sprite.ts "bento-proxy-e2e-${{ github.run_id }}-${{ github.run_attempt }}"

  modal:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Its own group, so a Modal run does not queue behind the sprite job.
    concurrency:
      group: model-proxy-e2e-modal
      cancel-in-progress: false
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/app
      BENTO_PROXY_MODAL_E2E: "1"
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      MODAL_ENVIRONMENT: ${{ secrets.MODAL_ENVIRONMENT }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A failed test step ends with a recap of every failing test (file,
      # line, name, error), so the last lines of the log, where GitHub
      # mobile opens it, say what failed. See scripts/test-failures-reporter.mjs.
      - name: Record failing tests for the recap
        run: |
          echo "BENTO_TEST_FAILURES_DIR=$RUNNER_TEMP/test-failures" >> "$GITHUB_ENV"
          echo "BENTO_TEST_REPORTERS=--test-reporter=spec --test-reporter-destination=stdout --test-reporter=$GITHUB_WORKSPACE/scripts/test-failures-reporter.mjs --test-reporter-destination=stderr" >> "$GITHUB_ENV"
      - run: pnpm turbo run build --filter=@bento/server^...

      - name: Note that a fork cannot provision a Modal sandbox
        if: ${{ env.MODAL_TOKEN_ID == '' && github.event.pull_request.head.repo.fork }}
        run: |
          echo "::notice::A fork has no Modal tokens, so no sandbox was provisioned. A maintainer can run this workflow by hand against the branch."

      - name: Refuse to pass without tokens
        if: ${{ (env.MODAL_TOKEN_ID == '' || env.MODAL_TOKEN_SECRET == '') && !github.event.pull_request.head.repo.fork }}
        run: |
          echo "MODAL_TOKEN_ID and MODAL_TOKEN_SECRET are not set, so no sandbox can be provisioned." >&2
          echo "Add them under Settings, Secrets and variables, Actions." >&2
          exit 1

      - name: Install cloudflared
        if: ${{ env.MODAL_TOKEN_ID != '' && env.MODAL_TOKEN_SECRET != '' }}
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/cloudflared" \
            "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64"
          echo "${CLOUDFLARED_SHA256}  $RUNNER_TEMP/cloudflared" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/cloudflared"
          "$RUNNER_TEMP/cloudflared" --version
          echo "BENTO_CLOUDFLARED=$RUNNER_TEMP/cloudflared" >> "$GITHUB_ENV"

      - name: Call the proxy from a restricted Modal sandbox
        if: ${{ env.MODAL_TOKEN_ID != '' && env.MODAL_TOKEN_SECRET != '' }}
        working-directory: apps/server
        env:
          NODE_OPTIONS: ${{ env.BENTO_TEST_REPORTERS }}
        run: node --test --import tsx src/model-proxy-sandbox.e2e.test.ts || { node "$GITHUB_WORKSPACE/scripts/test-failures-summary.mjs"; exit 1; }

      # The test terminates its own sandbox. This covers a cancelled
      # job, the timeout above, or a runner that died.
      - name: Terminate the sandbox even if the run was killed
        if: ${{ always() && env.MODAL_TOKEN_ID != '' && env.MODAL_TOKEN_SECRET != '' }}
        working-directory: packages/sandbox
        run: node --import tsx scripts/delete-modal-sandbox.ts "bento-proxy-e2e-${{ github.run_id }}-${{ github.run_attempt }}"
