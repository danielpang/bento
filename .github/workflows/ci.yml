name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/app
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A failed test step ends with a recap of every failing test (file,
      # line, name, error), so the last lines of the log, where GitHub
      # mobile opens it, say what failed. See scripts/test-failures-reporter.mjs.
      - name: Record failing tests for the recap
        run: |
          echo "BENTO_TEST_FAILURES_DIR=$RUNNER_TEMP/test-failures" >> "$GITHUB_ENV"
          echo "BENTO_TEST_REPORTERS=--test-reporter=spec --test-reporter-destination=stdout --test-reporter=$GITHUB_WORKSPACE/scripts/test-failures-reporter.mjs --test-reporter-destination=stderr" >> "$GITHUB_ENV"
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm db:migrate
      - run: pnpm db:migrate # idempotency check
      - name: Test
        env:
          NODE_OPTIONS: ${{ env.BENTO_TEST_REPORTERS }}
        run: pnpm test || { node "$GITHUB_WORKSPACE/scripts/test-failures-summary.mjs"; exit 1; }
      - name: Verify release installer behavior
        env:
          NODE_OPTIONS: ${{ env.BENTO_TEST_REPORTERS }}
        run: node --test scripts/install.test.mjs || { node "$GITHUB_WORKSPACE/scripts/test-failures-summary.mjs"; exit 1; }
      - name: Verify release tag resolution and retry guards
        env:
          NODE_OPTIONS: ${{ env.BENTO_TEST_REPORTERS }}
        run: node --test scripts/release-target.test.mjs || { node "$GITHUB_WORKSPACE/scripts/test-failures-summary.mjs"; exit 1; }
      - name: Verify the failing test recap
        env:
          NODE_OPTIONS: ${{ env.BENTO_TEST_REPORTERS }}
        run: node --test scripts/test-failures.test.mjs || { node "$GITHUB_WORKSPACE/scripts/test-failures-summary.mjs"; exit 1; }
