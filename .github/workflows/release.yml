name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the version and CLI dependencies
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5439:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5439/app
      BENTO_SANDBOX_DRIVER: local-process
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Validate the release tag
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/release-version.mjs "$TAG"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build typecheck --filter=@bento/tui...
      - run: pnpm db:migrate
      - run: pnpm exec turbo run test --filter=@bento/tui...
      - run: node --test scripts/install.test.mjs

  cli:
    name: Package CLI (${{ matrix.platform }})
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux-x64
          - runner: ubuntu-22.04-arm
            platform: linux-arm64
          - runner: macos-15-intel
            platform: darwin-x64
          - runner: macos-15
            platform: darwin-arm64
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build --filter=@bento/tui...
      - name: Package native dependencies and stamp the version
        env:
          TAG: ${{ github.ref_name }}
          EXPECTED_PLATFORM: ${{ matrix.platform }}
        run: |
          test "$(node -p 'process.platform + "-" + process.arch')" = "$EXPECTED_PLATFORM"
          node scripts/package-cli.mjs "$TAG"
      - name: Install and test the release outside the checkout
        env:
          TAG: ${{ github.ref_name }}
          PLATFORM: ${{ matrix.platform }}
        run: BENTO_TEST_ARCHIVE="$PWD/release-dist/bento-cli-$TAG-$PLATFORM.tar.gz" node --test scripts/install.test.mjs
      - uses: actions/upload-artifact@v6
        with:
          name: cli-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            release-dist/bento-cli-*.tar.gz
            release-dist/bento-cli-*.sha256
            release-dist/install.sh

  mac:
    name: Package the Mac app
    needs: verify
    uses: ./.github/workflows/desktop.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit

  release:
    name: Publish Bento release
    needs: [cli, mac]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          pattern: cli-*
          path: artifacts
          merge-multiple: true
      - uses: actions/download-artifact@v7
        with:
          name: desktop-macos
          path: artifacts
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          cat artifacts/*.sha256 > artifacts/SHA256SUMS
          (cd artifacts && sha256sum install.sh >> SHA256SUMS && sha256sum --check SHA256SUMS)
          {
            echo 'Install or update Bento:'
            echo
            echo '```bash'
            echo "curl -fsSL https://github.com/$REPO/releases/download/$TAG/install.sh | bash"
            echo 'bento --version'
            echo '```'
            echo
            echo 'Requires Node.js 22.19 or newer. The installer selects macOS or glibc Linux, x64 or arm64, and verifies SHA-256 checksums.'
            echo 'No pnpm or source checkout is required. Run the installer again to update.'
            echo
            echo "See [the CLI guide](https://github.com/$REPO/blob/$TAG/docs/tui.md) for local Docker setup and hosted connections."
            echo
            echo 'The macOS app uses the same release version. Download the arm64 DMG for Apple Silicon or the x64 DMG for Intel, then drag Bento to Applications.'
            echo 'The app bundles its runtime, so it does not need a separate Node.js installation.'
            echo 'Signed macOS releases download stable updates automatically. Choose Bento > Restart to Update when you are ready. Existing unsigned builds need a one-time manual replacement with this signed app.'
            echo "See [the Mac application guide](https://github.com/$REPO/blob/$TAG/apps/desktop/README.md) for setup and signing details."
          } > notes.md
          flags=()
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          # Draft first: an incomplete upload never becomes the latest installer.
          # A rerun may repair a draft, but never replace published release assets.
          if gh release view "$TAG" --json isDraft --jq .isDraft > is-draft.txt 2>/dev/null; then
            if [ "$(cat is-draft.txt)" != true ]; then
              echo "::error::$TAG is already published. Push a new version tag."
              exit 1
            fi
          else
            gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes-file notes.md "${flags[@]}"
          fi
          gh release upload "$TAG" artifacts/*.tar.gz artifacts/*.dmg artifacts/*.zip artifacts/*.blockmap artifacts/latest-mac.yml artifacts/install.sh artifacts/SHA256SUMS --clobber
          gh release edit "$TAG" --draft=false --notes-file notes.md "${flags[@]}"
