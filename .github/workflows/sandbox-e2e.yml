name: Sandbox e2e

# Provisions a real Fly Sprite and installs the real agent CLIs into it.
#
# Not part of CI, because it costs a machine and several minutes and it
# depends on four vendors' installers being up, which is not a reason to
# block an unrelated pull request. It runs when it earns its cost:
#
#   nightly       an installer that changed, moved, or went away is found
#                 by us rather than by somebody's card the next morning
#   toolchain PR  any change to the script that installs the CLIs, which
#                 is also every bump of TOOLCHAIN_VERSION. A bump makes
#                 every warm sprite reinstall at once, so it is the
#                 change most likely to hit a rate limit and the one
#                 that most needs a real machine to have agreed first
#   by hand       after an installer outage, to confirm it is over
#
# Needs the SPRITES_TOKEN secret. Without it the job says so and stops,
# rather than passing on a test that never ran.

on:
  schedule:
    - cron: "0 7 * * *"
  pull_request:
    paths:
      - packages/sandbox/src/agent-toolchain.ts
      - packages/sandbox/src/sprite.ts
      - packages/sandbox/src/sprite.e2e.test.ts
      - .github/workflows/sandbox-e2e.yml
  workflow_dispatch:

# One sprite at a time. Two runs would each create their own machine,
# which works, but serialising keeps the cost predictable and keeps a
# rate limited installer from being blamed on the wrong change.
concurrency:
  group: sandbox-e2e
  cancel-in-progress: false

jobs:
  sprite:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BENTO_SPRITE_E2E: "1"
      SPRITES_TOKEN: ${{ secrets.SPRITES_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # tsx runs the sandbox sources directly, but a workspace
      # dependency resolves through its package exports, which point at
      # dist. Without this build the test dies at import, and so does
      # the cleanup step below it, which is the one that stops a
      # cancelled run's sprite from being billed forever.
      - run: pnpm turbo run build --filter=@bento/sandbox^...

      # A pull request from a fork is not given secrets, which is not
      # that pull request's fault. Said out loud and passed over, so the
      # contributor is not staring at a red tick they cannot clear.
      - name: Note that a fork cannot provision a sprite
        if: ${{ env.SPRITES_TOKEN == '' && github.event.pull_request.head.repo.fork }}
        run: |
          echo "::notice::A fork has no SPRITES_TOKEN, so no sprite was provisioned. A maintainer can run this workflow by hand against the branch."

      # Otherwise the token is missing because nobody set it, and a
      # skipped test reads as a pass. A pull request that bumps the
      # toolchain deserves better than a green tick for a test that
      # never provisioned anything.
      - name: Refuse to pass without a token
        if: ${{ env.SPRITES_TOKEN == '' && !github.event.pull_request.head.repo.fork }}
        run: |
          echo "SPRITES_TOKEN is not set, so no sprite can be provisioned." >&2
          echo "Add it under Settings, Secrets and variables, Actions." >&2
          exit 1

      - name: Provision a sprite and install the agent CLIs
        if: ${{ env.SPRITES_TOKEN != '' }}
        working-directory: packages/sandbox
        run: node --test --import tsx src/sprite.e2e.test.ts

      # The test deletes its own machine and asserts that it went, so
      # this is for the paths where the test never got the chance: a
      # cancelled job, the timeout above, a runner that died. A sprite
      # lives until something deletes it, so "usually tidy" is not good
      # enough. The name comes from the run rather than from the test,
      # which is why the test derives it the same way, and why a test in
      # ordinary CI pins the two together.
      - name: Delete the sprite even if the run was killed
        if: ${{ always() && env.SPRITES_TOKEN != '' }}
        working-directory: packages/sandbox
        run: node --import tsx scripts/delete-sprite.ts "bento-e2e-${{ github.run_id }}-${{ github.run_attempt }}"
