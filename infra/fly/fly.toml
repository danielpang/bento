# Hosted Bento, the web half of production: the console, the API, the
# MCP gateway, webhooks, and every queue but the run workers. Agent runs
# are driven by the worker app (fly.worker.toml) from the same image;
# the two share Postgres and the LISTEN/NOTIFY bus on it. With no runs
# held here, Fly may suspend and scale this app on traffic alone.
app = "bento-production"
primary_region = "iad"
# Time between SIGTERM and SIGKILL on a deploy. The server's shutdown
# releases the runs it holds (so the new machine adopts them at once),
# severs streams, stops the queue and flushes analytics; Fly's default
# of five seconds was tight for that on a slow database.
kill_timeout = "30s"

[build]
  dockerfile = "../../infra/docker/Dockerfile"

[env]
  BENTO_MODE = "multi"
  BENTO_ENVIRONMENT = "production"
  BENTO_SANDBOX_DRIVER = "sprite"
  PORT = "8080"
  # The web half: this process drives no agent runs, the worker app
  # does. It still queues them, evaluates gates, and runs the Slack,
  # Linear and sweep jobs, and it never adopts an orphaned run, so Fly
  # suspending it strands nothing. BENTO_MAX_CONCURRENT_RUNS is not set
  # here on purpose: a web process refuses it at boot.
  BENTO_ROLE = "web"
  # The console is served from this same app, so the browser sees one
  # origin: session cookies, OAuth callbacks, the /device page and the
  # /accept-invitation link all work without CORS.
  BENTO_WEB_DIR = "/app/apps/web/dist"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  # Keep one machine warm: it owns the gate sweep and the interactive
  # queues (gates, Slack, Linear), which should not stop when web
  # traffic goes quiet. The run workers live on the worker app.
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"

# Secrets are set out of band, never committed:
#   fly secrets set BETTER_AUTH_SECRET=... BENTO_SECRET_KEY=... SPRITES_TOKEN=...
#   fly secrets set MODAL_TOKEN_ID=... MODAL_TOKEN_SECRET=... MODAL_ENVIRONMENT=...
#   fly secrets set GITHUB_APP_ID=... GITHUB_APP_SLUG=... GITHUB_PRIVATE_KEY=... GITHUB_WEBHOOK_SECRET=...
#   fly secrets set GOOGLE_CLIENT_ID=... GOOGLE_CLIENT_SECRET=...
