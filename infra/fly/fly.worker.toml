# fly.toml app configuration file generated for bento-worker on 2026-10-15T01:59:56Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'bento-worker'
primary_region = 'iad'
kill_timeout = '30s'

[build]
  dockerfile = '../../infra/docker/Dockerfile'

[env]
  BENTO_ENVIRONMENT = 'production'
  BENTO_MAX_CONCURRENT_RUNS = '32'
  BENTO_MCP_GATEWAY_URL = 'https://bento-production.fly.dev'
  BENTO_MODE = 'multi'
  BENTO_ROLE = 'worker'
  BENTO_SANDBOX_DRIVER = 'sprite'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  size = 'shared-cpu-2x'
  memory = '2gb'
