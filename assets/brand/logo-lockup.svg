<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280">
  <!-- Horizontal lockup on the app background: favicon mark + wordmark.
       Matches .brand in styles.css (bold sans, tight tracking). -->
  <rect width="960" height="280" fill="#0e0d0b"/>
  <g transform="translate(90,84) scale(1.75)">
    <rect x="1" y="1" width="62" height="62" rx="14" fill="#12161E" stroke="#39414F" stroke-width="2"/>
    <rect x="10" y="10" width="26" height="26" rx="5" fill="#F97316"/>
    <rect x="40" y="10" width="14" height="26" rx="5" fill="#3A4353"/>
    <rect x="10" y="40" width="14" height="14" rx="5" fill="#3A4353"/>
    <rect x="28" y="40" width="26" height="14" rx="5" fill="#3E77E8"/>
  </g>
  <text x="248" y="180" font-family="'SF Pro Display','Inter','Helvetica Neue',Arial,sans-serif" font-size="104" font-weight="700" letter-spacing="-1" fill="#ededed">bento</text>
</svg>
