<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Bento">
  <title>Bento</title>
  <!--
    The mark at tab size: a bento box of four compartments on its own
    plate, sized unevenly so the silhouette survives a 16px render
    instead of collapsing into an even grid.

    The plate is dark in every theme. It carries its own contrast, so
    the mark reads the same on a light tab strip as on a dark one and
    needs no prefers-color-scheme branch. Geometry matches
    `.brand-glyph` in styles.css and assets/brand/logo.svg.
  -->
  <rect x="1" y="1" width="62" height="62" rx="14" fill="#12161E" stroke="#39414F" stroke-width="2"/>
  <rect x="10" y="10" width="26" height="26" rx="5" fill="#F97316"/>
  <rect x="40" y="10" width="14" height="26" rx="5" fill="#3A4353"/>
  <rect x="10" y="40" width="14" height="14" rx="5" fill="#3A4353"/>
  <rect x="28" y="40" width="26" height="14" rx="5" fill="#3E77E8"/>
</svg>
